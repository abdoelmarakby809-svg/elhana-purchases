<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة العملاء – الهنا اليكتريك</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#18212f;--mute:#63708a;--line:#dde3ee;--pri:#163053;--on:#fff;--acc:#e09100;--ok:#12805c;--wn:#b36200;--bd:#c0352b;--hl:#eef3fa;--hd:#163053;--e1:cubic-bezier(.2,.7,.2,1);--d1:150ms;--d2:280ms;--sh:0 1px 2px rgba(22,48,83,.06),0 6px 18px rgba(22,48,83,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e7ebf3;--mute:#97a3ba;--line:#2a3550;--pri:#7fb0ea;--on:#0b1220;--acc:#f5b53d;--ok:#4fd1a0;--wn:#f0a35c;--bd:#ff8f84;--hl:#1f2a42;--hd:#0c1527;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#e7ebf3;--mute:#97a3ba;--line:#2a3550;--pri:#7fb0ea;--on:#0b1220;--acc:#f5b53d;--ok:#4fd1a0;--wn:#f0a35c;--bd:#ff8f84;--hl:#1f2a42;--hd:#0c1527;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header.top{background:var(--hd);color:#fff;border-bottom:3px solid var(--acc)}
header.top>div.in{max-width:1080px;margin:auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
#lg{height:54px;width:54px;border-radius:12px;background:#fff;padding:3px}
header.top h1{margin:0;font-size:1.25rem;font-weight:700}
header.top p{margin:0;color:#b9c6dc;font-size:.8rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:1080px;margin:auto}
nav a{white-space:nowrap;padding:7px 16px;border-radius:99px;color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.9rem}
nav a[aria-current]{background:var(--pri);color:var(--on);border-color:var(--pri)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1080px;margin:0 auto 48px;padding:0 16px}
h3{margin:18px 0 8px;font-size:1.05rem;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
details.card>summary{cursor:pointer;font-weight:700;color:var(--pri);list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{margin-bottom:10px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px;margin:8px 0 12px}
label{display:flex;flex-direction:column;gap:2px}
label>span{color:var(--mute);font-size:.8rem;font-weight:600}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;width:100%;padding:7px 10px;outline:0;min-height:38px}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
select option{background:var(--card);color:var(--ink)}
textarea{min-height:200px}
.srch{margin-bottom:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:start;vertical-align:middle;border-bottom:1px solid var(--line)}
th{background:var(--hl);color:var(--pri);font-size:.8rem;font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--hl) 55%,transparent)}
tr.g th{background:var(--bg);font-size:.9rem}
td.t,.t{font-variant-numeric:tabular-nums}
td.x{width:32px;padding:0 4px}
.lt td{padding:4px 6px}.lt td.n{width:34px;text-align:center;color:var(--mute)}.lt input{min-width:70px;padding:5px 8px;min-height:34px}.lt td:nth-child(2) input{min-width:170px}
.lt tbody{counter-reset:r}.lt tr{counter-increment:r}.lt td.n::before{content:counter(r)}
.lsum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 12px}
.lsum b{font-size:1.1rem;color:var(--pri)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--sh);border-inline-start:4px solid var(--acc)}
.chip small{display:block;color:var(--mute);font-size:.78rem}.chip b{font-size:1.2rem}
.btn{font:inherit;font-weight:600;background:var(--pri);color:var(--on);border:0;border-radius:8px;padding:8px 18px;cursor:pointer;margin:6px 0 0 6px}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.5;cursor:default}
.ic{background:0;border:0;color:var(--bd);font-size:1.25rem;cursor:pointer;line-height:1;padding:4px}
.lk{background:0;border:0;color:var(--pri);cursor:pointer;font:inherit;font-weight:600;text-decoration:underline;padding:0}
.ok{color:var(--ok)}.wn{color:var(--wn)}.bd{color:var(--bd)}.mu{color:var(--mute)}
.b{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:color-mix(in srgb,currentColor 13%,transparent)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.note{color:var(--mute);border-inline-start:3px solid var(--acc);padding-inline-start:10px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.bar label{min-width:150px}
tr.open td{background:var(--hl)}
[hidden]{display:none!important}
#tt{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--card);padding:9px 20px;border-radius:99px;z-index:20;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity var(--d2) var(--e1),transform var(--d2) var(--e1),visibility var(--d2)}#tt.on{opacity:1;visibility:visible;transform:none}
#pa{display:none}
@media(max-width:600px){header.top p{display:none}main,nav{padding-inline:10px}}
@media print{
:root:root:root{--bg:#fff;--card:#fff;--ink:#111;--mute:#555;--line:#bbb;--hl:#eef2f8;color-scheme:light}
@page{size:A4;margin:11mm}
body>*:not(#pa){display:none!important}body::before{display:none}
#pa{display:block;font-size:12px;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pa .lh{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:3px solid #163053;position:relative;margin-bottom:14px}
#pa .lh::after{content:"";position:absolute;inset-inline:0;bottom:-7px;height:2px;background:#e09100}
#pa .lh img{height:78px;width:78px}#pa .co{flex:1}#pa .co b{display:block;font-size:21px;color:#163053}#pa .co small{display:block;color:#444}
#pa .dt{min-width:150px;text-align:center;background:#163053;color:#fff;border-radius:8px;padding:8px 14px}#pa .dt b{display:block;font-size:16px}#pa .dt span{display:block;font-size:11px;opacity:.9}
#pa .mt{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px;margin:8px 0 12px;border:1px solid #cfd6e3;border-radius:6px;padding:4px 10px}
#pa .mt div{border-bottom:1px dashed #cfd6e3;padding:3px 0}#pa .mt small{color:#555;margin-inline-end:8px}
#pa table{width:100%;border-collapse:collapse;margin:8px 0}
#pa th{background:#163053;color:#fff;padding:6px 8px;border:1px solid #163053;font-size:11.5px}
#pa td{border:1px solid #b9c2d3;padding:5px 8px}
#pa tbody tr:nth-child(even) td{background:#f3f6fb}
#pa .tot{width:55%;margin-inline-start:auto}#pa .tot td:first-child{background:#e9eef7;font-weight:700}#pa .tot td:last-child{font-weight:700;font-size:13px}
#pa .wd{border:1px dashed #888;border-radius:6px;padding:6px 10px;margin:8px 0}
#pa .sg{display:flex;gap:22px;margin-top:46px;break-inside:avoid}#pa .sg div{flex:1;border-top:1px solid #111;text-align:center;padding-top:4px}
#pa .ft{margin-top:22px;border-top:1px solid #999;padding-top:6px;text-align:center;color:#666;font-size:10px}
#pa tr{break-inside:avoid}
}

/* motion */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
#app.enter>*{animation:up var(--d2) var(--e1) both}
#app.enter>*:nth-child(2){animation-delay:50ms}#app.enter>*:nth-child(3){animation-delay:100ms}#app.enter>*:nth-child(4){animation-delay:150ms}#app.enter>*:nth-child(n+5){animation-delay:200ms}
#app.enter tbody tr{animation:fade .4s var(--e1) both}
details[open]>:not(summary){animation:up var(--d2) var(--e1)}
details.card>summary::after{content:"+";float:left;font-size:1.3rem;line-height:1;transition:transform var(--d2) var(--e1)}
details.card[open]>summary::after{transform:rotate(45deg)}
.lt tr.nw{animation:fade var(--d2) var(--e1)}
nav a,.btn,.lk,.ic,.chip,.card,input,select,textarea,tbody tr td{transition:background-color var(--d1) ease,color var(--d1) ease,border-color var(--d1) ease,box-shadow var(--d1) ease,transform var(--d1) var(--e1),filter var(--d1) ease}
nav a:hover{transform:translateY(-1px);border-color:var(--pri)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active,nav a:active{transform:scale(.97)}
.chip:hover{transform:translateY(-2px)}.lk:hover{color:var(--acc)}.ic:hover{transform:scale(1.25)}
.b{transition:background-color var(--d1)}
/* login gate + user bar */
#gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate.on{display:flex;animation:fade var(--d2) var(--e1)}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:26px 24px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px;animation:up .45s var(--e1)}
.gc img{height:76px;width:76px;margin:auto;border-radius:16px;background:#fff;padding:3px;border:1px solid var(--line)}
.gc h2{margin:0;text-align:center;color:var(--pri);font-size:1.2rem}
.err{color:var(--bd);min-height:1.4em;font-size:.85rem}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite;margin:6px auto}
#me{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;flex-wrap:wrap;justify-content:flex-end}
.who{background:rgba(255,255,255,.14);padding:3px 12px;border-radius:99px}
#me .btn{margin:0;padding:3px 14px;background:transparent;border:1px solid #b9c6dc;color:#fff}
@media(max-width:600px){header.top h1{font-size:1rem}#lg{height:42px;width:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>

function ar(n){let c=Math.round(n*100),p=c%100,g=Math.floor(c/100);
 const o=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],
 t=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],
 hh=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
 const b=x=>{const r=[];if(x>=100)r.push(hh[Math.floor(x/100)]);x%=100;if(x)r.push(x<20?o[x]:(x%10?o[x%10]+' و':'')+t[Math.floor(x/10)]);return r.join(' و')};
 const k=(x,a,a2,a3)=>x==1?a:x==2?a2:x<=10?b(x)+' '+a3:b(x)+' '+a;
 const m=Math.floor(g/1e6),q=Math.floor(g%1e6/1e3),u=g%1000,r=[];
 if(m)r.push(k(m,'مليون','مليونان','ملايين'));if(q)r.push(k(q,'ألف','ألفان','آلاف'));if(u)r.push(b(u));
 return (r.join(' و')||'صفر')+' جنيه'+(p?' و'+b(p)+' قرش':'')+' مصري فقط لا غير'}

/* ---- accounts: collections allocated automatically (targeted invoice first, then oldest first). Cheques count only once collected ---- */
function acct(id){
 const inv=S.inv.filter(i=>i.cus==id).sort((a,b)=>cmpd(a.date,b.date)).map(i=>({...i,paid:0}));
 const pay=S.rcp.filter(p=>p.cus==id).sort((a,b)=>cmpd(a.date,b.date)).map(p=>({...p,al:[],left:N(p.amt)}));
 const take=(p,i)=>{const t=Math.min(p.left,N(i.amt)-i.paid);if(t>0.004){i.paid+=t;p.left-=t;p.al.push({no:i.no,amt:t})}};
 pay.forEach(p=>{const t=inv.find(i=>i.id==p.inv);if(t)take(p,t)});
 pay.forEach(p=>inv.forEach(i=>take(p,i)));
 const tot=inv.reduce((t,i)=>t+N(i.amt),0),paid=pay.reduce((t,p)=>t+N(p.amt),0);
 return{inv,pay,tot,paid,bal:Math.round((tot-paid)*100)/100};
}
const stt=a=>!a.inv.length?['لا فواتير','mu']:a.bal<=0.004?['مسدد','ok']:a.paid>0?['جزئي','wn']:['غير محصّل','bd'];

const soS=p=>{const L=p.lines||[];return L.length&&L.every(l=>N(l.rcv)>=N(l.qty))?'مُسلَّم':L.some(l=>N(l.rcv)>0)?'تسليم جزئي':'مفتوح'};

 out(){signOut(auth)},
