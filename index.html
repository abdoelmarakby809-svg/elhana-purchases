.card{border-top:1px solid var(--line);background:linear-gradient(90deg,var(--accent),var(--accent2)) top/100% 4px no-repeat,var(--paper)}

.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.42);transform:scale(0);animation:rp .65s ease-out;pointer-events:none}.btn.alt .rp{background:color-mix(in srgb,var(--accent) 28%,transparent)}

.kp:nth-child(1){--k:#f59e0b;--ic:'💰'}.kp:nth-child(2){--k:#6366f1;--ic:'🎯'}.kp:nth-child(3){--k:#8b5cf6;--ic:'🧾'}.kp:nth-child(4){--k:#10b981;--ic:'📦'}.kp.bd{--k:var(--bad)}
.kp::after{content:var(--ic);position:absolute;inset-inline-end:12px;top:10px;font-size:1.7rem;opacity:.9;animation:pp .6s cubic-bezier(.3,1.6,.5,1) both}

.chips div:nth-child(7n+1){--k2:#6366f1}.chips div:nth-child(7n+2){--k2:#0ea5e9}.chips div:nth-child(7n+3){--k2:#10b981}.chips div:nth-child(7n+4){--k2:#f59e0b}.chips div:nth-child(7n+5){--k2:#ec4899}.chips div:nth-child(7n+6){--k2:#8b5cf6}.chips div:nth-child(7n){--k2:#14b8a6}
.br i{background:linear-gradient(90deg,var(--accent),var(--accent2))}

<body>
<header class="top"><img id="lg" alt="شعار الهنا اليكتريك"><div><h1>إدارة المشتريات – الهنا اليكتريك</h1><p>الموردين · الأسعار · طلبات العروض · أوامر الشراء · حسابات الموردين</p></div><span id="me" class="mu" style="font-size:.78rem"></span><button class="btn alt" id="th" aria-label="تبديل الوضع الليلي والنهاري">🌙 ليلي</button><button class="btn alt" id="lo" hidden>تسجيل الخروج</button></header>
<nav id="nv" aria-label="الأقسام"></nav>
<section id="hero" aria-live="polite"><div class="hi"><span id="hi"></span></div><div><h2 id="ht"></h2><p id="hs"></p></div></section>
<main id="app"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></main>
<datalist id="dl"></datalist>
<div id="tt" role="status"></div>
<div id="pa"></div>
<div id="md" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const N=x=>+x||0,M=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const T=new Date().toISOString().slice(0,10),cmpd=(a,b)=>(a||'').localeCompare(b||'');
const S={sup:[],prc:[],po:[],inv:[],pay:[]};
let db,V='sup',sel='',opo='',pend=false,q='',pq='',LV='',dirty=false,LH=location.hash,ME={},ROLE='',U=[];const RL={admin:'مدير',editor:'محرر',viewer:'مشاهدة فقط'};
const nm=id=>(S.sup.find(s=>s.id==id)||{}).name||'—';
const supOpts=v=>[['','— اختر المورد —'],...S.sup.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(s=>[s.id,s.name])].map(([k,l])=>`<option value="${E(k)}"${k==v?' selected':''}>${E(l)}</option>`).join('');
const I=(n,l,t='text',v='')=>`<label><span>${l}</span><input name="${n}" type="${t}" value="${E(v)}"></label>`;
const fv=f=>Object.fromEntries($$('[name]',f).map(e=>[e.name,e.value.trim()]));
const lr=k=>`<tr>${k.map(n=>`<td><input name="${n}"${['qty','price','rcv'].includes(n)?' type="number" min="0" step="any" inputmode="decimal"':n=='item'?' list="dl"':''}></td>`).join('')}<td class="x noprint"><button class="ic" data-a="rmLine" aria-label="حذف السطر">×</button></td></tr>`;
const lt=(h,k,n)=>`<div class="tw"><table class="lt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th class="noprint"></th></tr></thead><tbody>${lr(k).repeat(n)}</tbody></table></div><button class="btn alt noprint" data-a="addLine" data-k="${k}">+ سطر</button>`;
const lines=f=>$$('tbody tr',f).map(fv).filter(r=>r.item);
const lp=(item,sup)=>S.prc.filter(p=>p.item==item&&p.sup==sup).sort((a,b)=>cmpd(b.date,a.date))[0];

/* ---- accounts: payments are allocated automatically (targeted invoice first, then oldest first) ---- */
function acct(id){
 const inv=S.inv.filter(i=>i.sup==id).sort((a,b)=>cmpd(a.date,b.date)).map(i=>({...i,paid:0}));
 const pay=S.pay.filter(p=>p.sup==id).sort((a,b)=>cmpd(a.date,b.date)).map(p=>{const pn=p.how=='شيك'&&p.chk=='معلق';return{...p,pn,al:[],left:pn?0:N(p.amt)}});
 const take=(p,i)=>{const t=Math.min(p.left,N(i.amt)-i.paid);if(t>0.004){i.paid+=t;p.left-=t;p.al.push({no:i.no,amt:t})}};
 pay.forEach(p=>{const t=inv.find(i=>i.id==p.inv);if(t&&!p.pn){if(N(t.amt)==0){t.paid+=p.left;p.al.push({no:t.no,amt:p.left});p.left=0}else take(p,t)}});
 pay.forEach(p=>inv.forEach(i=>take(p,i)));
 const tot=inv.reduce((t,i)=>t+N(i.amt),0),paid=pay.filter(p=>!p.pn).reduce((t,p)=>t+N(p.amt),0),pend=pay.filter(p=>p.pn).reduce((t,p)=>t+N(p.amt),0);
 const unb=S.po.filter(p=>p.sup==id&&ord(p)&&!S.inv.some(i=>i.sup==id&&i.po==p.no)).reduce((t,p)=>t+poT(p),0);
 return{inv,pay,tot,paid,pend,unb,exp:Math.round((tot-paid+unb-pend)*100)/100,bal:Math.round((tot-paid)*100)/100};
}
const stt=a=>!a.inv.length?['لا فواتير','mu']:a.inv.some(i=>!N(i.amt))?['فاتورة بدون قيمة','wn']:a.bal<=0?['مقفل','ok']:a.paid>0?['جزئي','wn']:['غير مسدد','bd'];
const ord=p=>p.st!='تسعير'&&p.st!='ملغي';const poT=p=>(p.lines||[]).reduce((t,l)=>t+N(l.qty)*N(l.price),0);
const poS=p=>{if(p.st=='تسعير')return'تسعير';if(p.st=='ملغي')return'ملغي';const L=p.lines||[];return L.length&&L.every(l=>N(l.rcv)>=N(l.qty))?'مستلم':L.some(l=>N(l.rcv)>0)?'استلام جزئي':'مفتوح'};
const chips=a=>`<div class="chips">${a.map(([l,v])=>`<div>${l}<b>${v}</b></div>`).join('')}</div>`;

/* ---- views ---- */
function supList(){
 const r=S.sup.map(s=>({s,a:acct(s.id)})).filter(({s})=>!q||(s.name+' '+(s.phone||'')+' '+(s.cat||'')).includes(q)).sort((x,y)=>x.s.name.localeCompare(y.s.name,'ar'));
 return `<div class="tw"><table><thead><tr><th>المورد</th><th>الهاتف</th><th>التصنيف</th><th>إجمالي الفواتير</th><th>المدفوع</th><th>المتبقي</th><th>الحساب</th><th></th></tr></thead><tbody>${r.map(({s,a})=>{const[t,c]=stt(a);return `<tr><td><button class="lk" data-a="acc" data-id="${s.id}">${E(s.name)}</button></td><td>${E(s.phone)}</td><td>${E(s.cat)}</td><td class="t">${M(a.tot)}</td><td class="t">${M(a.paid)}</td><td class="t">${a.bal<0?'له '+M(-a.bal):M(a.bal)}</td><td class="${c}">${t}</td><td style="white-space:nowrap"><button class="lk" data-a="ed" data-c="sup" data-id="${s.id}">تعديل</button> <button class="ic" data-a="del" data-c="sup" data-id="${s.id}" aria-label="حذف">×</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mu">لا يوجد موردين. أضف أول مورد من الأعلى.</td></tr>'}</tbody></table></div>`;
}
function vSup(){
 const A=S.sup.map(s=>acct(s.id));
 return chips([['عدد الموردين',S.sup.length],['حسابات عليها رصيد',A.filter(a=>a.bal>0).length],['إجمالي المستحق للموردين',M(A.reduce((t,a)=>t+Math.max(0,a.bal),0))],['أوامر شراء غير مكتملة',S.po.filter(p=>ord(p)&&poS(p)!='مستلم').length]])+
 `<details class="card noprint"><summary>+ إضافة مورد</summary><div class="frm"><div class="fl">${I('name','اسم المورد')}${I('phone','الهاتف / واتساب','tel')}${I('cat','التصنيف / الأصناف')}${I('terms','شروط الدفع')}${I('note','ملاحظات')}</div><button class="btn" data-a="addSup">حفظ المورد</button></div></details><input class="srch" id="q" placeholder="بحث بالاسم أو الهاتف أو التصنيف" value="${E(q)}" aria-label="بحث"><div id="sl">${supList()}</div>`;
}
function prcList(){
 const m={};S.prc.forEach(p=>{const k=p.item+'|'+p.sup;if(!m[k]||cmpd(p.date,m[k].date)>=0)m[k]=p});
 const g={};Object.values(m).forEach(p=>(g[p.item]=g[p.item]||[]).push(p));
 return `<div class="tw"><table><thead><tr><th>المورد</th><th>السعر</th><th>الوحدة</th><th>الفرق عن الأقل</th><th>تاريخ السعر</th><th></th></tr></thead><tbody>${Object.keys(g).sort((a,b)=>a.localeCompare(b,'ar')).filter(i=>!pq||i.includes(pq)).map(i=>{const r=g[i].sort((a,b)=>N(a.price)-N(b.price)),lo=N(r[0].price);return `<tr class="g"><th colspan="6">${E(i)} <small class="mu">(${r.length} مورد)</small></th></tr>`+r.map((p,k)=>`<tr${k?'':' class="lowr"'}><td>${E(nm(p.sup))}</td><td class="t">${M(N(p.price))}</td><td>${E(p.unit)}</td><td>${k||!lo?(lo?'+'+M((N(p.price)/lo-1)*100)+'%':''):'الأقل'}</td><td>${E(p.date)}</td><td class="x noprint" style="width:auto;white-space:nowrap;padding:0 8px"><button class="lk" data-a="ed" data-c="prc" data-id="${p.id}">تعديل</button> <button class="ic" data-a="del" data-c="prc" data-id="${p.id}" aria-label="حذف">×</button></td></tr>`).join('')}).join('')||'<tr><td colspan="6" class="mu">لا توجد أسعار بعد.</td></tr>'}</tbody></table></div>`;
}
const vPrc=()=>`<details class="card noprint" open><summary>+ تسجيل سعر من مورد</summary><div class="frm"><div class="fl">${I('item','الصنف').replace('name="item"','name="item" list="dl"')}<label><span>المورد</span><select name="sup">${supOpts('')}</select></label>${I('price','السعر','number')}${I('unit','الوحدة')}${I('date','التاريخ','date',T)}</div><button class="btn" data-a="addPrc">حفظ السعر</button></div></details><div class="acts noprint"><button class="btn alt" data-a="prPrc">طباعة قائمة الأسعار</button></div><input class="srch" id="pq" placeholder="ابحث عن صنف لمقارنة أسعار الموردين" value="${E(pq)}" aria-label="بحث صنف"><div id="pl">${prcList()}</div>`;
const vRfq=()=>`<div class="card frm"><div class="fl"><label><span>المورد</span><select name="sup">${supOpts('')}</select></label>${I('date','آخر موعد للرد','date')}${I('when','موعد التوريد المطلوب')}</div>${lt(['الصنف / الوصف','الكمية','الوحدة','ملاحظات / مواصفات'],['item','qty','unit','note'],5)}<button class="btn" data-a="rfqGen">إنشاء الرسالة</button></div><div id="ro"></div>`;
function vPo(){
 const L=S.po.slice().sort((a,b)=>cmpd(b.date,a.date));
 return `<details class="card noprint"><summary>+ أمر شراء جديد</summary><div class="frm" id="fp"><div class="fl"><label><span>النوع</span><select name="st"><option value="تسعير">تسعير (لا يُحسب على المورد)</option><option value="تم الطلب">أمر شراء (تم الطلب فعلًا)</option></select></label>${I('no','رقم الأمر (اختياري)')}<label><span>المورد</span><select name="sup">${supOpts('')}</select></label>${I('date','التاريخ','date',T)}${I('notes','ملاحظات / شروط')}</div>${lt(['الصنف','الوحدة','الكمية','سعر الوحدة'],['item','unit','qty','price'],4)}<button class="btn" data-a="addPo">حفظ أمر الشراء</button></div></details><div class="tw"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>المورد</th><th>الإجمالي</th><th>الاستلام</th><th></th></tr></thead><tbody>${L.map(p=>{const s=poS(p);return `<tr><td><button class="lk" data-a="openPo" data-id="${p.id}">${E(p.no)}</button></td><td>${E(p.date)}</td><td>${E(nm(p.sup))}</td><td class="t">${M(poT(p))}</td><td class="${s=='مستلم'?'ok':s=='مفتوح'?'bd':s=='تسعير'||s=='ملغي'?'mu':'wn'}">${s}</td><td style="white-space:nowrap">${p.st=='تسعير'?`<button class="lk" data-a="ordPo" data-id="${p.id}">تم الطلب</button> `:''}<button class="lk" data-a="ed" data-c="po" data-id="${p.id}">تعديل</button> <button class="ic" data-a="del" data-c="po" data-id="${p.id}" aria-label="حذف">×</button></td></tr>`}).join('')||'<tr><td colspan="6" class="mu">لا توجد أوامر شراء.</td></tr>'}</tbody></table></div>${poDet()}`;
}
function poDet(){
 const p=S.po.find(x=>x.id==opo);if(!p)return'';
 return `<div class="card"><h3>أمر شراء ${E(p.no)} – ${E(nm(p.sup))} – ${E(p.date)}</h3><div class="tw"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>المطلوب</th><th>السعر</th><th>المستلم</th><th>المتبقي</th></tr></thead><tbody>${(p.lines||[]).map((l,i)=>`<tr><td>${E(l.item)}</td><td>${E(l.unit)}</td><td class="t">${l.qty}</td><td class="t">${M(N(l.price))}</td><td><input type="number" min="0" step="any" data-rcv="${i}" value="${N(l.rcv)}"${p.st=='تسعير'?' disabled':''}></td><td class="t">${Math.max(0,N(l.qty)-N(l.rcv))}</td></tr>`).join('')}</tbody></table></div><p>الإجمالي: <b>${M(poT(p))}</b> · ${E(p.notes)}</p>${p.st=='تسعير'?`<p class="note">هذا تسعير ولم يُطلب من المورد بعد، لذلك لا يظهر في حسابه ولا في الرصيد المتوقع.</p><button class="btn" data-a="ordPo" data-id="${p.id}">تم الطلب من المورد (اعتماده على حساب المورد)</button><button class="btn alt" data-a="prPo">طباعة التسعير</button>`:`<button class="btn" data-a="recvAll">استلام كل الكميات</button><button class="btn alt" data-a="prPo">طباعة أمر الشراء</button>${(p.lines||[]).every(l=>!N(l.rcv))?`<button class="btn alt" data-a="unOrd" data-id="${p.id}">إرجاعه لتسعير</button>`:''}`}</div>`;
}
function vAcc(){
 const a=sel?acct(sel):null,s=S.sup.find(x=>x.id==sel);
 let h=`<label class="noprint" style="margin-bottom:12px"><span>المورد</span><select id="ss">${supOpts(sel)}</select></label>`;
 if(!a||!s)return h+'<p class="note">اختر موردًا لعرض حسابه، أو افتح حسابه من قائمة الموردين.</p>';
 const[t,c]=stt(a),un=a.inv.filter(i=>!N(i.amt)||N(i.amt)-i.paid>0.004);
 return h+`<div id="acct"><h3>كشف حساب: ${E(s.name)}</h3>${chips([['إجمالي الفواتير (دائن)',M(a.tot)],['المدفوع (مدين)',M(a.paid)],[a.bal<0?'مدين: رصيد مقدم':'دائن: المستحق للمورد',M(Math.abs(a.bal))],['أوامر شراء غير مفوترة',M(a.unb)],['شيكات معلقة (لم تُصرف)',M(a.pend)],['الرصيد المتوقع',M(a.exp)],['حالة الحساب',`<span class="${c}">${t}</span>`]])}
