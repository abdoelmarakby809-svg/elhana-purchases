<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المشتريات – الهنا اليكتريك</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e9ef;--paper:#fff;--ink:#1c2333;--mute:#5d6678;--line:#c4cbd8;--accent:#0b4f9c;--on:#fff;--warn:#b4530a;--ok:#0f7a4a;--bad:#b3261e;--hl:#e8f1fc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--paper:#1b2130;--ink:#e8ebf2;--mute:#9aa4b8;--line:#344057;--accent:#6aa9f0;--on:#0b1220;--warn:#f0a35c;--ok:#5fd09b;--bad:#ff8a80;--hl:#22324a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--paper:#1b2130;--ink:#e8ebf2;--mute:#9aa4b8;--line:#344057;--accent:#6aa9f0;--on:#0b1220;--warn:#f0a35c;--ok:#5fd09b;--bad:#ff8a80;--hl:#22324a;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
header.top{max-width:1000px;margin:auto;padding:14px 12px 0}
header.top h1{margin:0;font-size:1.3rem}
header.top p{margin:0;color:var(--mute);font-size:.8rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;max-width:1000px;margin:auto}
nav a{white-space:nowrap;padding:7px 14px;border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none;background:var(--paper)}
nav a[aria-current]{background:var(--accent);color:var(--on);border-color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1000px;margin:0 auto 40px;padding:0 12px}
.card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:4px;padding:14px;margin:0 0 14px}
details.card summary{cursor:pointer;font-weight:600;color:var(--accent)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;margin:10px 0}
label{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line)}
label span{color:var(--mute);font-size:.85rem;white-space:nowrap}
input,select,textarea{font:inherit;color:inherit;background:transparent;border:0;width:100%;padding:4px 2px;outline:0}
textarea{border:1px solid var(--line);border-radius:4px;padding:8px;min-height:230px;line-height:1.8}
select option{background:var(--paper);color:var(--ink)}
input:focus,select:focus{background:var(--hl)}
.srch{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:10px;background:var(--paper)}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:start;vertical-align:middle}
th{background:var(--hl);font-size:.85rem;font-weight:600}
tr.g th{background:var(--bg);font-size:.95rem}
tr.lowr td{color:var(--ok);font-weight:600}
.lt input{min-width:80px;border-bottom:1px solid var(--line)}
td.x{width:30px;padding:0}
.t{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips div{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:.85rem;color:var(--mute)}
.chips b{display:block;font-size:1.15rem;color:var(--ink)}
.btn{font:inherit;background:var(--accent);color:var(--on);border:0;border-radius:6px;padding:7px 16px;cursor:pointer;margin:6px 6px 0 0}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.ic{background:0;border:0;color:var(--bad);font-size:1.2rem;cursor:pointer;line-height:1}
.lk{background:0;border:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
.ok{color:var(--ok)}.wn{color:var(--warn)}.bd{color:var(--bad)}.mu{color:var(--mute)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.note{color:var(--mute);border-inline-start:3px solid var(--accent);padding-inline-start:10px}
#tt{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:6px;display:none;z-index:9}
#pa{display:none}
@media print{
:root:root:root{--bg:#fff;--paper:#fff;--ink:#000;--mute:#333;--line:#999;--hl:#eee;--ok:#000;--bad:#000;--warn:#000;color-scheme:light}
body>*:not(#pa){display:none!important}
#pa{display:block;padding:10px}.noprint{display:none!important}
pre{white-space:pre-wrap;font:inherit}
}
header.top{display:flex;align-items:center;gap:12px}header.top>div{flex:1}#lg{height:56px;width:56px}[hidden]{display:none!important}
@media print{@page{size:A4;margin:12mm}
#pa{font-size:12px;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1d3a6b;padding-bottom:10px;margin-bottom:12px}
.lh img{height:80px}.lh>div:nth-child(2){flex:1}.lh b{font-size:20px;display:block;color:#1d3a6b}.lh small{display:block;color:#444}
.dt{text-align:center;border:2px solid #1d3a6b;border-radius:6px;padding:6px 14px}.dt b{font-size:17px;display:block}.dt span{display:block}
.mt{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 20px;margin-bottom:12px}.mt div{border-bottom:1px solid #bbb;padding:2px 0}.mt small{color:#555;margin-inline-end:8px}
#pa table{width:100%;border-collapse:collapse;margin:8px 0}#pa th{background:#1d3a6b;color:#fff;padding:6px;border:1px solid #1d3a6b}#pa td{border:1px solid #999;padding:5px 6px}#pa tbody tr:nth-child(even){background:#f3f6fb}
#pa .tot{width:50%;margin-inline-start:auto}.tot td:first-child{background:#f3f6fb;font-weight:700}
.wd{border:1px dashed #888;padding:6px 10px;margin:8px 0}
.sg{display:flex;gap:20px;margin-top:50px}.sg div{flex:1;border-top:1px solid #111;text-align:center;padding-top:4px}
.ft{margin-top:24px;border-top:1px solid #999;padding-top:6px;text-align:center;color:#666;font-size:10px}}
</style>
</head>
<body>
<header class="top"><img id="lg" alt="شعار الهنا اليكتريك"><div><h1>إدارة المشتريات – الهنا اليكتريك</h1><p>الموردين · الأسعار · طلبات العروض · أوامر الشراء · حسابات الموردين</p></div><button class="btn alt" id="lo" hidden>تسجيل الخروج</button></header>
<nav id="nv" aria-label="الأقسام"></nav>
<main id="app"><p class="note">جاري تحميل البيانات…</p></main>
<datalist id="dl"></datalist>
<div id="tt" role="status"></div>
<div id="pa"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const N=x=>+x||0,M=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const T=new Date().toISOString().slice(0,10),cmpd=(a,b)=>(a||'').localeCompare(b||'');
const S={sup:[],prc:[],po:[],inv:[],pay:[]};
let db,V='sup',sel='',opo='',pend=false,q='',pq='';
const nm=id=>(S.sup.find(s=>s.id==id)||{}).name||'—';
const supOpts=v=>[['','— اختر المورد —'],...S.sup.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(s=>[s.id,s.name])].map(([k,l])=>`<option value="${E(k)}"${k==v?' selected':''}>${E(l)}</option>`).join('');
const I=(n,l,t='text',v='')=>`<label><span>${l}</span><input name="${n}" type="${t}" value="${E(v)}"></label>`;
const fv=f=>Object.fromEntries($$('[name]',f).map(e=>[e.name,e.value.trim()]));
const lr=k=>`<tr>${k.map(n=>`<td><input name="${n}"${n=='qty'||n=='price'?' type="number" min="0" step="any" inputmode="decimal"':n=='item'?' list="dl"':''}></td>`).join('')}<td class="x noprint"><button class="ic" data-a="rmLine" aria-label="حذف السطر">×</button></td></tr>`;
const lt=(h,k,n)=>`<div class="tw"><table class="lt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th class="noprint"></th></tr></thead><tbody>${lr(k).repeat(n)}</tbody></table></div><button class="btn alt noprint" data-a="addLine" data-k="${k}">+ سطر</button>`;
const lines=f=>$$('tbody tr',f).map(fv).filter(r=>r.item);
const lp=(item,sup)=>S.prc.filter(p=>p.item==item&&p.sup==sup).sort((a,b)=>cmpd(b.date,a.date))[0];

/* ---- accounts: payments are allocated automatically (targeted invoice first, then oldest first) ---- */
function acct(id){
 const inv=S.inv.filter(i=>i.sup==id).sort((a,b)=>cmpd(a.date,b.date)).map(i=>({...i,paid:0}));
 const pay=S.pay.filter(p=>p.sup==id).sort((a,b)=>cmpd(a.date,b.date)).map(p=>({...p,al:[],left:N(p.amt)}));
 const take=(p,i)=>{const t=Math.min(p.left,N(i.amt)-i.paid);if(t>0.004){i.paid+=t;p.left-=t;p.al.push({no:i.no,amt:t})}};
 pay.forEach(p=>{const t=inv.find(i=>i.id==p.inv);if(t)take(p,t)});
 pay.forEach(p=>inv.forEach(i=>take(p,i)));
 const tot=inv.reduce((t,i)=>t+N(i.amt),0),paid=pay.reduce((t,p)=>t+N(p.amt),0);
 return{inv,pay,tot,paid,bal:Math.round((tot-paid)*100)/100};
}
const stt=a=>!a.inv.length?['لا فواتير','mu']:a.bal<=0?['مقفل','ok']:a.paid>0?['جزئي','wn']:['غير مسدد','bd'];
const poT=p=>(p.lines||[]).reduce((t,l)=>t+N(l.qty)*N(l.price),0);
const poS=p=>{const L=p.lines||[];return L.length&&L.every(l=>N(l.rcv)>=N(l.qty))?'مستلم':L.some(l=>N(l.rcv)>0)?'استلام جزئي':'مفتوح'};
const chips=a=>`<div class="chips">${a.map(([l,v])=>`<div>${l}<b>${v}</b></div>`).join('')}</div>`;

/* ---- views ---- */
function supList(){
 const r=S.sup.map(s=>({s,a:acct(s.id)})).filter(({s})=>!q||(s.name+' '+(s.phone||'')+' '+(s.cat||'')).includes(q)).sort((x,y)=>x.s.name.localeCompare(y.s.name,'ar'));
 return `<div class="tw"><table><thead><tr><th>المورد</th><th>الهاتف</th><th>التصنيف</th><th>إجمالي الفواتير</th><th>المدفوع</th><th>المتبقي</th><th>الحساب</th><th></th></tr></thead><tbody>${r.map(({s,a})=>{const[t,c]=stt(a);return `<tr><td><button class="lk" data-a="acc" data-id="${s.id}">${E(s.name)}</button></td><td>${E(s.phone)}</td><td>${E(s.cat)}</td><td class="t">${M(a.tot)}</td><td class="t">${M(a.paid)}</td><td class="t">${a.bal<0?'له '+M(-a.bal):M(a.bal)}</td><td class="${c}">${t}</td><td><button class="ic" data-a="del" data-c="sup" data-id="${s.id}" aria-label="حذف">×</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mu">لا يوجد موردين. أضف أول مورد من الأعلى.</td></tr>'}</tbody></table></div>`;
}
function vSup(){
 const A=S.sup.map(s=>acct(s.id));
 return chips([['عدد الموردين',S.sup.length],['حسابات عليها رصيد',A.filter(a=>a.bal>0).length],['إجمالي المستحق للموردين',M(A.reduce((t,a)=>t+Math.max(0,a.bal),0))],['أوامر شراء غير مكتملة',S.po.filter(p=>poS(p)!='مستلم').length]])+
 `<details class="card noprint"><summary>+ إضافة مورد</summary><div class="frm"><div class="fl">${I('name','اسم المورد')}${I('phone','الهاتف / واتساب','tel')}${I('cat','التصنيف / الأصناف')}${I('terms','شروط الدفع')}${I('note','ملاحظات')}</div><button class="btn" data-a="addSup">حفظ المورد</button></div></details><input class="srch" id="q" placeholder="بحث بالاسم أو الهاتف أو التصنيف" value="${E(q)}" aria-label="بحث"><div id="sl">${supList()}</div>`;
}
function prcList(){
 const m={};S.prc.forEach(p=>{const k=p.item+'|'+p.sup;if(!m[k]||cmpd(p.date,m[k].date)>=0)m[k]=p});
 const g={};Object.values(m).forEach(p=>(g[p.item]=g[p.item]||[]).push(p));
 return `<div class="tw"><table><thead><tr><th>المورد</th><th>السعر</th><th>الوحدة</th><th>الفرق عن الأقل</th><th>تاريخ السعر</th><th></th></tr></thead><tbody>${Object.keys(g).sort((a,b)=>a.localeCompare(b,'ar')).filter(i=>!pq||i.includes(pq)).map(i=>{const r=g[i].sort((a,b)=>N(a.price)-N(b.price)),lo=N(r[0].price);return `<tr class="g"><th colspan="6">${E(i)} <small class="mu">(${r.length} مورد)</small></th></tr>`+r.map((p,k)=>`<tr${k?'':' class="lowr"'}><td>${E(nm(p.sup))}</td><td class="t">${M(N(p.price))}</td><td>${E(p.unit)}</td><td>${k||!lo?(lo?'+'+M((N(p.price)/lo-1)*100)+'%':''):'الأقل'}</td><td>${E(p.date)}</td><td class="x"><button class="ic" data-a="del" data-c="prc" data-id="${p.id}" aria-label="حذف">×</button></td></tr>`).join('')}).join('')||'<tr><td colspan="6" class="mu">لا توجد أسعار بعد.</td></tr>'}</tbody></table></div>`;
}
const vPrc=()=>`<details class="card noprint" open><summary>+ تسجيل سعر من مورد</summary><div class="frm"><div class="fl">${I('item','الصنف').replace('name="item"','name="item" list="dl"')}<label><span>المورد</span><select name="sup">${supOpts('')}</select></label>${I('price','السعر','number')}${I('unit','الوحدة')}${I('date','التاريخ','date',T)}</div><button class="btn" data-a="addPrc">حفظ السعر</button></div></details><input class="srch" id="pq" placeholder="ابحث عن صنف لمقارنة أسعار الموردين" value="${E(pq)}" aria-label="بحث صنف"><div id="pl">${prcList()}</div>`;
const vRfq=()=>`<div class="card frm"><div class="fl"><label><span>المورد</span><select name="sup">${supOpts('')}</select></label>${I('date','آخر موعد للرد','date')}${I('when','موعد التوريد المطلوب')}</div>${lt(['الصنف / الوصف','الكمية','الوحدة','ملاحظات / مواصفات'],['item','qty','unit','note'],5)}<button class="btn" data-a="rfqGen">إنشاء الرسالة</button></div><div id="ro"></div>`;
function vPo(){
 const L=S.po.slice().sort((a,b)=>cmpd(b.date,a.date));
 return `<details class="card noprint"><summary>+ أمر شراء جديد</summary><div class="frm" id="fp"><div class="fl">${I('no','رقم الأمر (اختياري)')}<label><span>المورد</span><select name="sup">${supOpts('')}</select></label>${I('date','التاريخ','date',T)}${I('notes','ملاحظات / شروط')}</div>${lt(['الصنف','الوحدة','الكمية','سعر الوحدة'],['item','unit','qty','price'],4)}<button class="btn" data-a="addPo">حفظ أمر الشراء</button></div></details><div class="tw"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>المورد</th><th>الإجمالي</th><th>الاستلام</th><th></th></tr></thead><tbody>${L.map(p=>{const s=poS(p);return `<tr><td><button class="lk" data-a="openPo" data-id="${p.id}">${E(p.no)}</button></td><td>${E(p.date)}</td><td>${E(nm(p.sup))}</td><td class="t">${M(poT(p))}</td><td class="${s=='مستلم'?'ok':s=='مفتوح'?'bd':'wn'}">${s}</td><td><button class="ic" data-a="del" data-c="po" data-id="${p.id}" aria-label="حذف">×</button></td></tr>`}).join('')||'<tr><td colspan="6" class="mu">لا توجد أوامر شراء.</td></tr>'}</tbody></table></div>${poDet()}`;
}
function poDet(){
 const p=S.po.find(x=>x.id==opo);if(!p)return'';
 return `<div class="card"><h3>أمر شراء ${E(p.no)} – ${E(nm(p.sup))} – ${E(p.date)}</h3><div class="tw"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>المطلوب</th><th>السعر</th><th>المستلم</th><th>المتبقي</th></tr></thead><tbody>${(p.lines||[]).map((l,i)=>`<tr><td>${E(l.item)}</td><td>${E(l.unit)}</td><td class="t">${l.qty}</td><td class="t">${M(N(l.price))}</td><td><input type="number" min="0" step="any" data-rcv="${i}" value="${N(l.rcv)}"></td><td class="t">${Math.max(0,N(l.qty)-N(l.rcv))}</td></tr>`).join('')}</tbody></table></div><p>الإجمالي: <b>${M(poT(p))}</b> · ${E(p.notes)}</p><button class="btn" data-a="recvAll">استلام كل الكميات</button><button class="btn alt" data-a="prPo">طباعة أمر الشراء</button></div>`;
}
function vAcc(){
 const a=sel?acct(sel):null,s=S.sup.find(x=>x.id==sel);
 let h=`<label class="noprint" style="margin-bottom:12px"><span>المورد</span><select id="ss">${supOpts(sel)}</select></label>`;
 if(!a||!s)return h+'<p class="note">اختر موردًا لعرض حسابه، أو افتح حسابه من قائمة الموردين.</p>';
 const[t,c]=stt(a),un=a.inv.filter(i=>N(i.amt)-i.paid>0.004);
 return h+`<div id="acct"><h3>كشف حساب: ${E(s.name)}</h3>${chips([['إجمالي الفواتير',M(a.tot)],['المدفوع',M(a.paid)],[a.bal<0?'رصيد له':'المتبقي عليه',M(Math.abs(a.bal))],['حالة الحساب',`<span class="${c}">${t}</span>`]])}
 <div class="g2 noprint"><div class="card frm" id="fi"><b>تسجيل فاتورة</b><div class="fl">${I('no','رقم الفاتورة')}${I('date','التاريخ','date',T)}${I('amt','القيمة','number')}${I('po','رقم أمر الشراء')}</div><button class="btn" data-a="addInv">حفظ الفاتورة</button></div>
 <div class="card frm" id="fy"><b>تسجيل دفعة</b><div class="fl">${I('date','التاريخ','date',T)}${I('amt','المبلغ','number')}<label><span>الطريقة</span><select name="how"><option>نقدي</option><option>تحويل بنكي</option><option>شيك</option></select></label><label><span>تخصيص على</span><select name="inv"><option value="">تلقائي (الأقدم أولًا)</option>${un.map(i=>`<option value="${i.id}">فاتورة ${E(i.no)} – متبقي ${M(N(i.amt)-i.paid)}</option>`).join('')}</select></label></div><button class="btn" data-a="addPay">حفظ الدفعة</button></div></div>
 <h3>الفواتير</h3><div class="tw"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>القيمة</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody>${a.inv.map(i=>{const r=N(i.amt)-i.paid;return `<tr><td>${E(i.no)}</td><td>${E(i.date)}</td><td class="t">${M(N(i.amt))}</td><td class="t">${M(i.paid)}</td><td class="t">${M(Math.max(0,r))}</td><td class="${r<=0.004?'ok':i.paid>0?'wn':'bd'}">${r<=0.004?'مسددة':i.paid>0?'جزئي':'غير مسددة'}</td><td class="x noprint" style="width:auto;white-space:nowrap;padding:0 8px"><button class="lk" data-a="prInv" data-id="${i.id}">طباعة</button> <button class="ic" data-a="del" data-c="inv" data-id="${i.id}" aria-label="حذف">×</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mu">لا توجد فواتير.</td></tr>'}</tbody></table></div>
 <h3>الدفعات وعلى أي فاتورة تمت المحاسبة</h3><div class="tw"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th><th>غطّت</th><th></th></tr></thead><tbody>${a.pay.map(p=>`<tr><td>${E(p.date)}</td><td class="t">${M(N(p.amt))}</td><td>${E(p.how)}</td><td>${p.al.map(x=>`فاتورة ${E(x.no)}: ${M(x.amt)}`).join('، ')}${p.left>0.004?` — دفعة مقدمة ${M(p.left)}`:''}</td><td class="x noprint" style="width:auto;white-space:nowrap;padding:0 8px"><button class="lk" data-a="prPay" data-id="${p.id}">سند صرف</button> <button class="ic" data-a="del" data-c="pay" data-id="${p.id}" aria-label="حذف">×</button></td></tr>`).join('')||'<tr><td colspan="5" class="mu">لا توجد دفعات.</td></tr>'}</tbody></table></div></div><button class="btn alt noprint" data-a="prAcc">طباعة كشف الحساب</button>`;
}
const VW={sup:vSup,prc:vPrc,rfq:vRfq,po:vPo,acc:vAcc},TT={sup:'الموردين',prc:'الأسعار والمقارنة',rfq:'طلب عرض سعر',po:'أوامر الشراء والاستلام',acc:'حسابات الموردين'};
$('#nv').innerHTML=Object.keys(TT).map(k=>`<a href="#${k}">${TT[k]}</a>`).join('');

/* ---- rendering ---- */
function draw(){
 if(window.AUTH&&!db)return showLogin();
 const a=document.activeElement;
 if(a&&$('#app').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){pend=true;return}
 pend=false;V=VW[location.hash.slice(1)]?location.hash.slice(1):'sup';
 $('#app').innerHTML=VW[V]();
 $$('#nv a').forEach(x=>x.toggleAttribute('aria-current',x.getAttribute('href')=='#'+V));
 $('#dl').innerHTML=[...new Set(S.prc.map(p=>p.item))].map(i=>`<option value="${E(i)}">`).join('');
}
addEventListener('focusout',()=>setTimeout(()=>{if(pend)draw()},250));
addEventListener('hashchange',()=>{pend=false;draw()});
let tm;const toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',2600)};
const LOGO='logo.png';$('#lg').src=LOGO;
function ar(n){let c=Math.round(n*100),p=c%100,g=Math.floor(c/100);
 const o=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],
 t=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],
 hh=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
 const b=x=>{const r=[];if(x>=100)r.push(hh[Math.floor(x/100)]);x%=100;if(x)r.push(x<20?o[x]:(x%10?o[x%10]+' و':'')+t[Math.floor(x/10)]);return r.join(' و')};
 const k=(x,a,a2,a3)=>x==1?a:x==2?a2:x<=10?b(x)+' '+a3:b(x)+' '+a;
 const m=Math.floor(g/1e6),q=Math.floor(g%1e6/1e3),u=g%1000,r=[];
 if(m)r.push(k(m,'مليون','مليونان','ملايين'));if(q)r.push(k(q,'ألف','ألفان','آلاف'));if(u)r.push(b(u));
 return (r.join(' و')||'صفر')+' جنيه'+(p?' و'+b(p)+' قرش':'')+' مصري فقط لا غير'}
function printHTML(h,t,no,dt,meta=[]){$('#pa').innerHTML=`<div class="lh"><img src="${LOGO}" alt=""><div><b>شركة الهنا اليكتريك</b><small>EL HANA ELECTRIC</small><small>العاشر من رمضان – منطقة 6 مليون – قطعة 165، 166، 168</small></div><div class="dt"><b>${t}</b>${no?`<span>رقم: ${E(no)}</span>`:''}<span>التاريخ: ${E(dt||T)}</span></div></div>${meta.length?`<div class="mt">${meta.map(([l,v])=>`<div><small>${l}</small><b>${E(v)}</b></div>`).join('')}</div>`:''}${h}<div class="ft">صادر من نظام إدارة المشتريات – شركة الهنا اليكتريك</div>`;print()}
const sg=a=>`<div class="sg">${a.map(x=>`<div>${x}</div>`).join('')}</div>`;
const wd=n=>`<div class="wd">المبلغ كتابةً: <b>${ar(n)}</b></div>`;
const th=h=>`<thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead>`;

/* ---- actions ---- */
const W=(c,o)=>db.collection(c).add(o).then(()=>{toast('تم الحفظ');document.activeElement?.blur();pend=false;draw()}).catch(()=>toast('تعذر الحفظ. تأكد أن لديك صلاحية التعديل.'));
const F=b=>b.closest('.frm');
const A={
 addSup(b){const d=fv(F(b));if(!d.name)return toast('اكتب اسم المورد');W('sup',d)},
 addPrc(b){const d=fv(F(b));if(!d.item||!d.sup||!N(d.price))return toast('أكمل الصنف والمورد والسعر');d.price=N(d.price);W('prc',d)},
 addLine(b){const t=b.previousElementSibling.querySelector('tbody');t.insertAdjacentHTML('beforeend',lr(b.dataset.k.split(',')))},
 rmLine(b){const t=b.closest('tbody');if(t.rows.length>1)b.closest('tr').remove()},
 addPo(b){const f=F(b),d=fv($('.fl',f)),L=lines(f).map(l=>({item:l.item,unit:l.unit,qty:N(l.qty),price:N(l.price),rcv:0}));
  if(!d.sup||!L.length)return toast('اختر المورد وأضف صنفًا واحدًا على الأقل');
  d.no=d.no||'PO-'+String(S.po.length+1).padStart(3,'0');d.lines=L;W('po',d)},
 addInv(b){const d=fv(F(b));if(!N(d.amt))return toast('اكتب قيمة الفاتورة');d.sup=sel;d.amt=N(d.amt);d.no=d.no||'INV-'+(S.inv.filter(i=>i.sup==sel).length+1);W('inv',d)},
 addPay(b){const d=fv(F(b));if(!N(d.amt))return toast('اكتب المبلغ');d.sup=sel;d.amt=N(d.amt);W('pay',d)},
 acc(b){sel=b.dataset.id;location.hash='acc'},
 openPo(b){opo=opo==b.dataset.id?'':b.dataset.id;draw()},
 recvAll(){const p=S.po.find(x=>x.id==opo);db.collection('po').doc(opo).update({lines:p.lines.map(l=>({...l,rcv:N(l.qty)}))})},
 prPo(){const p=S.po.find(x=>x.id==opo),s=S.sup.find(x=>x.id==p.sup)||{};printHTML(`<table>${th(['م','الصنف','الوحدة','الكمية','سعر الوحدة','الإجمالي'])}<tbody>${p.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${E(l.item)}</td><td>${E(l.unit)}</td><td>${l.qty}</td><td>${M(N(l.price))}</td><td>${M(N(l.qty)*N(l.price))}</td></tr>`).join('')}</tbody></table><table class="tot"><tr><td>الإجمالي</td><td>${M(poT(p))}</td></tr></table>${wd(poT(p))}${p.notes?`<p><b>ملاحظات وشروط:</b> ${E(p.notes)}</p>`:''}${sg(['مسؤول المشتريات','المدير المالي','اعتماد الإدارة','ختم الشركة'])}`,'أمر شراء',p.no,p.date,[['السادة / المورد',s.name||'—'],['الهاتف',s.phone||''],['شروط الدفع',s.terms||''],['عنوان التسليم','العاشر من رمضان – منطقة 6 مليون']])},
 prAcc(){printHTML($('#acct').innerHTML,'كشف حساب مورد','',T,[['المورد',nm(sel)]])},
 prInv(b){const a=acct(sel),i=a.inv.find(x=>x.id==b.dataset.id),r=N(i.amt)-i.paid,ps=a.pay.filter(p=>p.al.some(x=>x.no==i.no));
  printHTML(`<table>${th(['رقم الفاتورة','تاريخ الفاتورة','أمر الشراء','القيمة','المسدد','المتبقي'])}<tbody><tr><td>${E(i.no)}</td><td>${E(i.date)}</td><td>${E(i.po)}</td><td>${M(N(i.amt))}</td><td>${M(i.paid)}</td><td>${M(Math.max(0,r))}</td></tr></tbody></table>${wd(N(i.amt))}<p><b>حالة السداد:</b> ${r<=0.004?'مسددة بالكامل':i.paid>0?'مسددة جزئيًا':'غير مسددة'}</p>${ps.length?`<table>${th(['تاريخ الدفعة','الطريقة','المحاسب على هذه الفاتورة'])}<tbody>${ps.map(p=>`<tr><td>${E(p.date)}</td><td>${E(p.how)}</td><td>${M(p.al.filter(x=>x.no==i.no).reduce((t,x)=>t+x.amt,0))}</td></tr>`).join('')}</tbody></table>`:''}${sg(['مسؤول المشتريات','المحاسب','اعتماد الإدارة'])}`,'بيان فاتورة مورد',i.no,i.date,[['المورد',nm(sel)]])},
 prPay(b){const p=acct(sel).pay.find(x=>x.id==b.dataset.id);
  printHTML(`<table>${th(['المبلغ','طريقة الدفع','تاريخ الدفع'])}<tbody><tr><td><b>${M(N(p.amt))}</b></td><td>${E(p.how)}</td><td>${E(p.date)}</td></tr></tbody></table>${wd(N(p.amt))}<p><b>بيان الصرف:</b> ${p.al.map(x=>`فاتورة ${E(x.no)}: ${M(x.amt)}`).join('، ')||'—'}${p.left>0.004?` — دفعة مقدمة ${M(p.left)}`:''}</p>${sg(['المستلم','أمين الصندوق','المدير المالي'])}`,'سند صرف','',p.date,[['صرف إلى السيد / شركة',nm(sel)]])},
 rfqGen(b){
  const f=F(b),d=fv($('.fl',f)),L=lines(f);if(!L.length)return toast('أضف صنفًا واحدًا على الأقل');
  const s=S.sup.find(x=>x.id==d.sup);
  const tx=`شركة الهنا اليكتريك – طلب عرض سعر\n${s?'السادة / '+s.name+'\n':''}تحية طيبة، نرجو التكرم بتسعير الأصناف التالية:\n\n${L.map((l,i)=>`${i+1}) ${l.item} — ${l.qty||''} ${l.unit||''}${l.note?' ('+l.note+')':''}`).join('\n')}\n\nالمطلوب في ردكم:\n• سعر الوحدة لكل صنف\n• مدة التوريد\n• شروط الدفع\n• مدة سريان العرض\n${d.date?'آخر موعد للرد: '+d.date+'\n':''}${d.when?'موعد التوريد المطلوب: '+d.when+'\n':''}عنوان التسليم: العاشر من رمضان – منطقة 6 مليون\nشكرًا لحسن تعاونكم.`;
  let ph=((s&&s.phone)||'').replace(/\D/g,'');if(ph[0]=='0')ph='20'+ph.slice(1);
  $('#ro').innerHTML=`<div class="card"><textarea id="rt" aria-label="نص الطلب">${E(tx)}</textarea><button class="btn" data-a="cp">نسخ</button><a class="btn alt" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent(tx)}">إرسال واتساب</a><button class="btn alt" data-a="prRfq">طباعة</button></div>`},
 cp(){const t=$('#rt');t.select();try{navigator.clipboard.writeText(t.value);toast('تم النسخ')}catch(e){document.execCommand('copy');toast('تم النسخ')}},
 prRfq(){printHTML('<pre>'+E($('#rt').value)+'</pre>','طلب عرض سعر','',T)},
 del(b){if(!b.dataset.s){b.dataset.s=1;b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.s='';b.textContent='×'},3000);return}
  db.collection(b.dataset.c).doc(b.dataset.id).delete().catch(()=>toast('تعذر الحذف'))}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&db&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id=='q'){q=t.value.trim();$('#sl').innerHTML=supList()}
 if(t.id=='pq'){pq=t.value.trim();$('#pl').innerHTML=prcList()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='ss'){sel=t.value;pend=false;draw()}
 if(t.dataset.rcv!=null){const p=S.po.find(x=>x.id==opo),L=p.lines.map(l=>({...l}));L[+t.dataset.rcv].rcv=N(t.value);db.collection('po').doc(opo).update({lines:L})}
 if(t.name=='item'&&t.closest('#fp')){const r=t.closest('tr'),s=$('#fp [name=sup]').value,p=lp(t.value.trim(),s),pi=$('[name=price]',r);if(p&&pi&&!pi.value){pi.value=p.price;$('[name=unit]',r).value=$('[name=unit]',r).value||p.unit||''}}});

/* ---- data (Firebase) ---- */
window.AUTH=1;
function showLogin(){$('#lo').hidden=true;$('#app').innerHTML=`<form class="card frm" id="lf" style="max-width:380px;margin:30px auto"><b>تسجيل الدخول</b><div class="fl" style="grid-template-columns:1fr">${I('em','البريد الإلكتروني','email')}${I('pw','كلمة المرور','password')}</div><button class="btn" type="submit">دخول</button><p class="bd" id="le"></p></form>`;
 $('#lf').onsubmit=e=>{e.preventDefault();firebase.auth().signInWithEmailAndPassword($('[name=em]').value.trim(),$('[name=pw]').value).catch(()=>$('#le').textContent='بيانات الدخول غير صحيحة')}}
(function(){
 if(!window.firebase||!window.firebaseConfig||/YOUR_/.test(firebaseConfig.apiKey)){$('#app').innerHTML='<p class="note">أكمل إعداد ملف firebase-config.js (الخطوات في README).</p>';return}
 firebase.initializeApp(firebaseConfig);const fs=firebase.firestore();let subs=[];
 $('#lo').onclick=()=>firebase.auth().signOut();
 firebase.auth().onAuthStateChanged(u=>{subs.forEach(f=>f());subs=[];if(!u){db=null;return showLogin()}
  db=fs;$('#lo').hidden=false;$('#app').innerHTML='<p class="note">جاري تحميل البيانات…</p>';
  Object.keys(S).forEach(c=>subs.push(fs.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>toast('تعذر تحميل بعض البيانات'))));draw()})
})();
</script>
